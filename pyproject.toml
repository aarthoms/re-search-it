[project]
name = "re-search-it"
version = "0.1.0"
description = "Autonomous arXiv Paper Digest and QA Agent"
requires-python = ">=3.10"

[project.scripts]
re-search-it = "re_search_it.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
